spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/myblogbackapp
spring.datasource.username=postgres
spring.datasource.password=postgres

server.port=8080

spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.jdbc.bind=TRACE

spring.jpa.properties.hibernate.format_sql=true

app.upload-dir=/Users/bibik/Downloads/uploads
app.upload-dir.allowed-image-extensions=.jpg, .jpeg, .png, .webp

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate